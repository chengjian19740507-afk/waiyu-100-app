<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Noto+Sans+SC:wght@700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #0f172a;
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    overflow: hidden;
  }
  .icon {
    width: 512px; height: 512px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 30% 22%, rgba(220,38,38,0.20) 0%, transparent 60%),
      radial-gradient(circle at 75% 80%, rgba(59,130,246,0.10) 0%, transparent 55%),
      #0f172a;
  }
  .num {
    font-family: 'Inter', sans-serif;
    font-size: 300px;
    font-weight: 900;
    line-height: 0.88;
    color: #dc2626;
    letter-spacing: -12px;
    text-shadow: 0 0 90px rgba(220,38,38,0.30);
  }
  .cn {
    margin-top: 18px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 42px;
    font-weight: 700;
    color: #f8fafc;
    letter-spacing: 12px;
  }
  .label {
    margin-top: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 8px;
    color: #94a3b8;
  }
</style>
</head>
<body>
<div class="icon">
  <div class="num">150</div>
  <div class="cn">外语日常</div>
  <div class="label">DAILY PHRASES</div>
</div>
</body>
</html>
