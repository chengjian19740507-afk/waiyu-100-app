<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>海外旅游日常用语150句 · 多语种入门</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="title">
    <h1 id="app-title">海外旅游日常用语150句</h1>
    <p class="subtitle" id="app-subtitle">英/西/法/俄/日/韩/阿 7 语种切换</p>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div class="search-box">
  <input type="search" id="search" placeholder="🔍 搜索单词 · 中文 / 外语 / 罗马字" autocomplete="off" aria-label="搜索">
  <button id="search-clear" aria-label="清除搜索" hidden>×</button>
</div>

<nav class="langs" id="langs" aria-label="语种切换">
  <button class="lang-chip active" data-lang="en">English 英语</button>
  <button class="lang-chip" data-lang="es">Español 西语</button>
  <button class="lang-chip" data-lang="fr">Français 法语</button>
  <button class="lang-chip" data-lang="ru">Русский 俄语</button>
  <button class="lang-chip" data-lang="ja">日本語 日语</button>
  <button class="lang-chip" data-lang="ko">한국어 韩语</button>
  <button class="lang-chip" data-lang="ar">العربية 阿语</button>
</nav>

<nav class="cats" id="cats" aria-label="类别"></nav>

<main class="cards" id="cards"></main>

<footer class="tip">
  <p>觉得有用？支持开发者持续更新 👇</p>
  <div class="tip-buttons">
    <a class="tip-btn bmc" href="https://www.buymeacoffee.com/jimmaa" target="_blank" rel="noopener">☕ Buy Me a Coffee</a>
    <a class="tip-btn wechat" href="#" onclick="alert('微信扫一扫赞赏码：请联系开发者获取');return false;">💬 微信赞赏</a>
  </div>
  <div class="tip-card">
    <div class="tip-card-item">
      <img src="tip-card.png" alt="微信赞赏码 · 北极虎" loading="lazy" />
      <p class="tip-card-hint">↓ 微信扫码 · 北极虎的赞赏码</p>
    </div>
    <div class="tip-card-item">
      <img src="tip-alipay.png" alt="支付宝收款码 · 北极虎" loading="lazy" />
      <p class="tip-card-hint">↓ 支付宝扫一扫 · 北极虎的收款码</p>
    </div>
  </div>
  <p class="copyright">© 2026 北极虎 · All Rights Reserved · 未经授权禁止商业用途</p>
</footer>

<template id="card-tpl">
  <article class="card" data-id="">
    <div class="num"></div>
    <div class="body">
      <div class="text" dir="auto"></div>
      <div class="romanization"></div>
      <div class="translation"></div>
    </div>
    <button class="play" aria-label="播放">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path fill="currentColor" d="M8 5v14l11-7z"/>
      </svg>
    </button>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
