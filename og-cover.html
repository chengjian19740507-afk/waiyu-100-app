<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>OG Cover · 海外旅游日常用语150句</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;700;900&family=Noto+Sans+SC:wght@400;700;900&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0f172a;
    color: #f8fafc;
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    width: 800px;
    height: 800px;
    overflow: hidden;
  }
  .cover {
    width: 800px;
    height: 800px;
    box-sizing: border-box;
    padding: 80px 70px 70px;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(circle at 20% 0%, rgba(220,38,38,0.10) 0%, transparent 55%),
      radial-gradient(circle at 100% 100%, rgba(59,130,246,0.08) 0%, transparent 50%),
      #0f172a;
  }
  .top-line {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }
  .top-line::before {
    content: '';
    display: inline-block;
    width: 24px;
    height: 2px;
    background: #dc2626;
  }
  .top-line .label {
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 4px;
    color: #94a3b8;
    text-transform: uppercase;
  }
  .title {
    font-family: 'Noto Sans SC', 'Inter', sans-serif;
    font-size: 56px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: 2px;
    color: #f8fafc;
    margin: 0 0 14px;
  }
  .num-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin: 14px 0 8px;
  }
  .num {
    font-family: 'Inter', sans-serif;
    font-size: 180px;
    font-weight: 900;
    line-height: 0.9;
    color: #dc2626;
    letter-spacing: -6px;
  }
  .num-unit {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 38px;
    font-weight: 700;
    color: #f8fafc;
    letter-spacing: 4px;
  }
  .num-sub {
    margin-left: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    font-weight: 400;
    color: #94a3b8;
    letter-spacing: 2px;
  }
  .divider {
    margin: 30px 0 26px;
    height: 1px;
    background: linear-gradient(to right, rgba(148,163,184,0.5), transparent);
  }
  .langs {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 0;
  }
  .lang-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    font-size: 22px;
    line-height: 1.3;
  }
  .lang-row .name {
    font-weight: 700;
  }
  .lang-row .zh {
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 400;
    font-size: 14px;
    color: #94a3b8;
    letter-spacing: 1px;
  }
  .lang-en    { font-family: 'Inter', sans-serif; }
  .lang-es    { font-family: 'Inter', sans-serif; }
  .lang-fr    { font-family: 'Inter', sans-serif; }
  .lang-ru    { font-family: 'Inter', sans-serif; }
  .lang-ja    { font-family: 'Noto Sans JP', 'Inter', sans-serif; }
  .lang-ko    { font-family: 'Noto Sans KR', 'Inter', sans-serif; }
  .lang-ar    { font-family: 'Noto Naskh Arabic', 'Inter', sans-serif; direction: rtl; }
  .footer {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    color: #64748b;
    font-size: 13px;
    letter-spacing: 1.5px;
  }
  .footer .author {
    font-family: 'Noto Sans SC', sans-serif;
    color: #cbd5e1;
    font-weight: 700;
  }
  .badge {
    display: inline-block;
    padding: 5px 12px;
    border: 1px solid rgba(220,38,38,0.5);
    color: #fca5a5;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="top-line">
    <span class="label">MULTILINGUAL · 7 LANGUAGES</span>
    <span class="badge">2026</span>
  </div>

  <h1 class="title">海外旅游日常用语</h1>

  <div class="num-row">
    <span class="num">150</span>
    <span class="num-unit">句</span>
    <span class="num-sub">DAILY PHRASES</span>
  </div>

  <div class="divider"></div>

  <div class="langs">
    <div class="lang-row"><span class="name lang-en">English</span><span class="zh">英 语</span></div>
    <div class="lang-row"><span class="name lang-es">Español</span><span class="zh">西 语</span></div>
    <div class="lang-row"><span class="name lang-fr">Français</span><span class="zh">法 语</span></div>
    <div class="lang-row"><span class="name lang-ru">Русский</span><span class="zh">俄 语</span></div>
    <div class="lang-row"><span class="name lang-ja">日本語</span><span class="zh">日 语</span></div>
    <div class="lang-row"><span class="name lang-ko">한국어</span><span class="zh">韩 语</span></div>
    <div class="lang-row"><span class="name lang-ar">العربية</span><span class="zh">阿 语</span></div>
  </div>

  <div class="footer">
    <span class="author">北 极 虎</span>
    <span>chengjian19740507-afk.github.io</span>
  </div>
</div>
</body>
</html>
